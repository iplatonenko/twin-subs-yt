name: Build & Publish Userscript

on:
  push:
    branches: [main]
    paths-ignore:
      - "dist/**"
  workflow_dispatch:

permissions:
  contents: write

env:
  NODE_VERSION: "20"
  SCRIPT_BASENAME: "twin-subs-yt"
  BUILD_OUT: "dist/twin-subs-yt.user.js"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Set version (CalVer UTC)
        run: echo "BUILD_VERSION=$(date -u +'%Y.%m.%d.%H%M')" >> $GITHUB_ENV

      - name: Build
        run: |
          echo "Building version $BUILD_VERSION"
          BUILD_VERSION=$BUILD_VERSION npm run build
          test -f "$BUILD_OUT" || (echo "Not found $BUILD_OUT" && exit 1)

      - name: Patch @version in .user.js
        shell: bash
        run: |
          node -e "
            const fs=require('fs');
            const p=process.env.BUILD_OUT;
            let s=fs.readFileSync(p,'utf8');
            if(!/@version\\s+/m.test(s)){ console.error('No @version in header'); process.exit(1); }
            s=s.replace(/(@version\\s+).*/m, (m,g)=> g + process.env.BUILD_VERSION);
            fs.writeFileSync(p,s);
          "

      - name: Publish to dist branch
        shell: bash
        run: |
          set -e

          # Save file to /tmp/publish
          mkdir -p /tmp/publish
          cp -f "$BUILD_OUT" /tmp/publish/${SCRIPT_BASENAME}.user.js

          git fetch origin

          # Switch to or create the dist branch
          if git show-ref --verify --quiet refs/heads/dist; then
            git switch dist
          else
            git switch --orphan dist
          fi

          # Clear the working tree of the dist branch and leave only the necessary file
          git ls-files -z | xargs -0 git rm -q -f || true

          # Put the userscript file in the root of the dist branch
          cp -f /tmp/publish/${SCRIPT_BASENAME}.user.js ./

          git add -f ${SCRIPT_BASENAME}.user.js
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "publish: ${SCRIPT_BASENAME} ${BUILD_VERSION}" || echo "Nothing to commit"

          # Publish the dist branch
          git push -f origin dist

          # Return to main branch
          git switch -q main || true
